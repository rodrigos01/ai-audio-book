steps:
  # Step 1: Compute branch-prefixed service names (master deploys unprefixed)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$BRANCH_NAME" = "master" ]; then
          PREFIX=""
        else
          PREFIX="$BRANCH_NAME-"
        fi
        echo "$${PREFIX}ai-audio-book-api" > backend_service.txt
        echo "$${PREFIX}ai-audio-book" > frontend_service.txt
        echo "Backend service: $$(cat backend_service.txt)"
        echo "Frontend service: $$(cat frontend_service.txt)"

  # Step 2: Download the service account key from GCS
  - name: 'gcr.io/cloud-builders/gsutil'
    args: ['cp', 'gs://${_SECRETS_BUCKET}/ai-audio-book-key.json', 'backend/ai-audio-book-key.json']

  # Step 3: Build the Backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-audio-book-api'
      - '-f'
      - 'backend/Dockerfile'
      - '.'

  # Step 4: Push the Backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ai-audio-book-api']

  # Step 5: Deploy Backend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_SERVICE=$$(cat backend_service.txt)
        gcloud run deploy "$$BACKEND_SERVICE" \
          --image gcr.io/$PROJECT_ID/ai-audio-book-api \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated \
          --execution-environment gen2 \
          --timeout 3600 \
          --add-volume name=storage-volume,type=cloud-storage,bucket=ai-audio-book-storage-ai-audio-book \
          --add-volume-mount volume=storage-volume,mount-path=/app/storage \
          --update-env-vars STORAGE_BASE_PATH=/app/storage,GOOGLE_APPLICATION_CREDENTIALS=/app/backend/ai-audio-book-key.json,NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GEMINI_API_KEY=${_GEMINI_API_KEY}

  # Step 6: Get backend service URL
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_SERVICE=$$(cat backend_service.txt)
        BACKEND_URL=$$(gcloud run services describe "$$BACKEND_SERVICE" --platform managed --region us-central1 --format="value(status.url)")
        echo "$$BACKEND_URL" > backend_url.txt
        echo "Backend URL is: $$BACKEND_URL"

  # Step 7: Build the Frontend Docker image using retrieved backend URL
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_URL=$$(cat backend_url.txt)
        docker build \
          -t gcr.io/$PROJECT_ID/ai-audio-book \
          -f frontend/Dockerfile \
          --build-arg VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY} \
          --build-arg VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN} \
          --build-arg VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID} \
          --build-arg VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET} \
          --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID} \
          --build-arg VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID} \
          --build-arg VITE_GOOGLE_CLIENT_ID=${_VITE_GOOGLE_CLIENT_ID} \
          --build-arg VITE_API_BASE_URL=$$BACKEND_URL/api \
          .

  # Step 8: Push the Frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ai-audio-book']

  # Step 9: Deploy Frontend to Cloud Run (original user-facing service)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        FRONTEND_SERVICE=$$(cat frontend_service.txt)
        gcloud run deploy "$$FRONTEND_SERVICE" \
          --image gcr.io/$PROJECT_ID/ai-audio-book \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated

  # Step 10: Update Backend CORS to frontend URL
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_SERVICE=$$(cat backend_service.txt)
        FRONTEND_SERVICE=$$(cat frontend_service.txt)
        FRONTEND_URL=$$(gcloud run services describe "$$FRONTEND_SERVICE" --platform managed --region us-central1 --format="value(status.url)")
        echo "Updating CORS allowed origin on backend to: $$FRONTEND_URL"
        gcloud run services update "$$BACKEND_SERVICE" \
          --platform managed \
          --region us-central1 \
          --update-env-vars ALLOWED_ORIGINS=$$FRONTEND_URL

  # Step 11: Deploy Sample Generation Job
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'ai-audio-book-generate-samples'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ai-audio-book-api'
      - '--region'
      - 'us-central1'
      - '--command'
      - 'node'
      - '--args'
      - 'scripts/generate_samples.js'
      - '--add-volume'
      - 'name=storage-volume,type=cloud-storage,bucket=ai-audio-book-storage-ai-audio-book'
      - '--add-volume-mount'
      - 'volume=storage-volume,mount-path=/app/storage'
      - '--update-env-vars'
      - 'STORAGE_BASE_PATH=/app/storage,GOOGLE_APPLICATION_CREDENTIALS=/app/backend/ai-audio-book-key.json,NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GEMINI_API_KEY=${_GEMINI_API_KEY}'

  # Step 12: Execute Sample Generation Job
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'ai-audio-book-generate-samples'
      - '--region'
      - 'us-central1'
      - '--wait'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SECRETS_BUCKET: ''
  _VITE_FIREBASE_API_KEY: ''
  _VITE_FIREBASE_AUTH_DOMAIN: ''
  _VITE_FIREBASE_PROJECT_ID: ''
  _VITE_FIREBASE_STORAGE_BUCKET: ''
  _VITE_FIREBASE_MESSAGING_SENDER_ID: ''
  _VITE_FIREBASE_APP_ID: ''
  _VITE_GOOGLE_CLIENT_ID: ''
  _GEMINI_API_KEY: ''
