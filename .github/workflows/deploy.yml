name: Deploy to Cloud Run

# Deploys production (ai-audio-book / ai-audio-book-api, unprefixed -- see
# scripts/deploy-source-helper.js's branch-prefix logic) on every push to
# master. This intentionally does NOT cover claude-develop: that pair stays
# under direct control of whichever Claude Code agent is iterating on it,
# deployed interactively via `npm run deploy-source`.
#
# Requires the corresponding Cloud Build trigger ("ai-audio-book-deploy",
# push to master) to be disabled in the console so both don't fire on the
# same push -- see CLAUDE.md.
on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required to mint the OIDC token for Workload Identity Federation

env:
  # All pulled from GitHub Actions secrets -- see CLAUDE.md for the full list
  # to add under Settings > Secrets and variables > Actions. None of these
  # are committed to the repo, even the ones that aren't strictly sensitive
  # (Firebase web config, OAuth client ID).
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/883622140264/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: player@ai-audio-book.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm run deploy-source
