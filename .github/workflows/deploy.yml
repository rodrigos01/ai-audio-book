name: Deploy to Cloud Run

# Deploys on every push to master (production: ai-audio-book /
# ai-audio-book-api, unprefixed) or claude-develop (the shared dev pair:
# claude-develop-ai-audio-book(-api)) -- see scripts/deploy-source-helper.js's
# branch-prefix logic, which this reuses as-is. Agents should push to
# claude-develop to deploy rather than running `npm run deploy-source`
# interactively: this path is faster (see below) and doesn't require a
# Claude Code cloud session's sandbox at all. See CLAUDE.md.
#
# Builds are done directly on the runner with Docker Buildx + its native
# GitHub Actions cache backend, rather than shelling out to Kaniko/Cloud
# Build like the interactive deploy-source scripts do -- GitHub-hosted
# runners have a real Docker daemon (the interactive scripts don't, which is
# why they need Kaniko in the first place), so there's no Cloud Build
# provisioning latency, no Kaniko executor image pull, and no GCS
# source-upload round trip. See scripts/actions-deploy.js.
#
# Requires the corresponding Cloud Build triggers ("ai-audio-book-deploy" for
# master, "ai-audio-book-deploy-claude-develop" for claude-develop) to be
# disabled in the console so they don't also fire on the same push -- see
# CLAUDE.md.
on:
  push:
    branches:
      - master
      - claude-develop
  workflow_dispatch: {}

# A second push to the same branch while a deploy is still running would
# race with it -- concurrent `gcloud run deploy` calls against the same
# service can finish out of order, so the wrong revision could end up
# serving traffic. Cancel the in-flight run for that branch instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required to mint the OIDC token for Workload Identity Federation

env:
  # All pulled from GitHub Actions secrets -- see CLAUDE.md for the full list
  # to add under Settings > Secrets and variables > Actions. None of these
  # are committed to the repo, even the ones that aren't strictly sensitive
  # (Firebase web config, OAuth client ID).
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/883622140264/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: player@ai-audio-book.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Backend ---

      - id: stage-backend
        run: node scripts/actions-deploy.js stage-backend

      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.stage-backend.outputs.dir }}
          push: true
          tags: ${{ steps.stage-backend.outputs.image }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - id: deploy-backend
        run: node scripts/actions-deploy.js deploy-backend "${{ steps.stage-backend.outputs.service }}" "${{ steps.stage-backend.outputs.image }}"

      # --- Frontend (needs the backend URL to bake in as VITE_API_BASE_URL) ---

      - id: stage-frontend
        run: node scripts/actions-deploy.js stage-frontend "${{ steps.deploy-backend.outputs.url }}"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.stage-frontend.outputs.dir }}
          push: true
          tags: ${{ steps.stage-frontend.outputs.image }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - id: deploy-frontend
        run: node scripts/actions-deploy.js deploy-frontend "${{ steps.stage-frontend.outputs.service }}" "${{ steps.stage-frontend.outputs.image }}"

      - run: node scripts/actions-deploy.js cors "${{ steps.stage-backend.outputs.service }}" "${{ steps.deploy-frontend.outputs.url }}"
